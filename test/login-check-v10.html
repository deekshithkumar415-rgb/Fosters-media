<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foster's Media · Login Diagnostic v10</title><style>body{font:16px system-ui;background:#101010;color:#f8f0e9;padding:20px;max-width:650px;margin:auto}h1{color:#ff8979}label{display:block;margin:20px 0}input{display:block;background:#222;color:white;border:1px solid #666;border-radius:8px;padding:13px;width:100%;box-sizing:border-box;font-size:16px}button{background:#ff8979;color:#111;border:0;border-radius:8px;padding:14px;font-weight:700}pre{white-space:pre-wrap;background:#222;padding:16px;border-radius:8px;min-height:80px}small{color:#aaa}</style></head><body><h1>FOSTER'S MEDIA</h1><p>Login Diagnostic v10 · Isolated test page</p><p>This page checks the connection without loading the full dashboard.</p><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="go">Test sign-in</button><pre id="out">Ready. No sign-in attempted.</pre><small>Never share your password or a screenshot with the password visible. The diagnostic shows only connection and error status.</small><script>
(function(){
const out=document.getElementById('out'),btn=document.getElementById('go');let client=null;function show(s){out.textContent=s}
window.addEventListener('error',e=>{show('Browser script issue: '+(e.message==='Script error.'?'External library could not run.':e.message))});
async function loadLibrary(){if(window.supabase?.createClient)return;show('Loading Supabase connection library…');let failed=[];for(const src of ['https://unpkg.com/@supabase/supabase-js@2.49.10/dist/umd/supabase.js','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.js']){try{await new Promise((resolve,reject)=>{const tag=document.createElement('script');tag.src=src;tag.onload=()=>window.supabase?.createClient?resolve():reject(Error('Library missing after load'));tag.onerror=()=>reject(Error('Library blocked or unavailable'));document.head.appendChild(tag);setTimeout(()=>reject(Error('Library loading timed out')),10000)});return}catch(e){failed.push(e.message)}}throw Error('Could not load connection library. Try Safari or another network. '+failed.join('; '))}
btn.onclick=async()=>{btn.disabled=true;try{await loadLibrary();show('Library loaded. Connecting to Supabase…');client=window.supabase.createClient('https://naonyxojsozwatpsiogo.supabase.co','sb_publishable_-B_chzmxnDeoQzWnzxcUWQ_vA1b4_L9');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){show('Enter email and password.');return}show('Checking credentials…');const result=await Promise.race([client.auth.signInWithPassword({email,password}),new Promise((_,reject)=>setTimeout(()=>reject(Error('Sign-in request timed out.')),15000))]);if(result.error){show('Supabase sign-in response: '+result.error.message);return}const u=result.data?.user;if(!u){show('Sign-in returned no user.');return}show('Sign-in successful. Open Admin v9 to access your dashboard.')}catch(e){show('Diagnostic: '+(e.message||'Unknown error'))}finally{btn.disabled=false}};
})();
