<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foster's Media | Influencer Portal</title><style>
:root{font-family:system-ui,sans-serif;color:#f9eee8;background:#111}*{box-sizing:border-box}body{margin:0}header{padding:24px;background:#1d1d1d;border-bottom:1px solid #383838}header strong{color:#fa8e80;font-size:22px}main{max-width:850px;margin:20px auto;padding:0 16px}section,article{background:#202020;border:1px solid #383838;border-radius:16px;padding:20px;margin:16px 0}h1{font-size:26px}h2{font-size:20px}label{display:block;margin:12px 0}input{width:100%;padding:13px;border:1px solid #555;border-radius:9px;background:#111;color:white;font-size:16px}button{background:#fa8e80;color:#161616;border:0;border-radius:9px;padding:12px 16px;font-weight:700;cursor:pointer}button.secondary{background:#343434;color:white}.muted{color:#bbb}.notice{color:#ffbdad}.hidden{display:none}a{color:#ffad9f}.visit{padding:10px;border-top:1px solid #444}@media(min-width:1000px){main{max-width:1200px;padding:0 36px;margin:36px auto}header{padding:26px max(36px,calc((100vw - 1200px)/2))}section,article{padding:30px;margin:24px 0}#campaigns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}#campaigns>article,#campaigns>section{margin:0}}@media(max-width:600px){main{padding:0 12px}section,article{padding:18px}header{padding:18px}button{min-height:44px}}img{max-width:100%}</style><style id="fosters-red-black-theme">
:root{color-scheme:dark;--fm-red:#ed343e;--fm-red-light:#ff5962;--fm-black:#0c0c0e}
html,body{background:#0e0e10!important;color:#f7f1f2!important}
header{background:#111113!important;border-bottom:2px solid #e3333f!important}header strong{color:#f33c48!important}
section,article{background:#1c1b1e!important;border:1px solid #463438!important;box-shadow:0 6px 22px #0003!important}
h1,h2,h3{color:#fff!important}.muted{color:#c4b5b8!important}.notice{color:#ff8089!important}
input{background:#101012!important;color:#fff!important;border:1px solid #62454a!important}input:focus{outline:2px solid #e3333f!important}
button{background:#e3333f!important;color:#fff!important}button.secondary{background:#302326!important;color:#ffd7d9!important;border:1px solid #6b3c42!important}
a{color:#ff828b!important}.visit{border-top:1px solid #45383b!important}
</style><style id="fm-cinematic-reveal">
#fmCinematic{position:relative;min-height:92svh;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 28%,#50171f,#09090b 68%);border:1px solid #4d242d;border-radius:22px;margin:12px 0 0}
#fmCinematic video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
#fmCinematic:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#08070a30 5%,#0b090c66 50%,#08080ce6 100%);pointer-events:none}
#fmCinematic .fm-cine-text{position:relative;z-index:1;text-align:center;padding:35px 16px 70px;color:white}
#fmCinematic .fm-cine-text h2{font-size:clamp(28px,6vw,55px)!important;color:white!important;margin:0 0 10px}
#fmCinematic .fm-cine-text p{color:#e3cfd2;margin:8px 0}
#fmCinematic .fm-cine-arrow{display:inline-block;font-size:30px;margin-top:10px;animation:fmArrow 1.5s infinite}
@keyframes fmArrow{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}
#fmCinematic+.fm-cine-content{position:relative;z-index:2;margin-top:-25px;border-radius:24px 24px 0 0;background:#111114;padding-top:22px;box-shadow:0 -18px 40px #0008}
@media(prefers-reduced-motion:reduce){#fmCinematic .fm-cine-arrow{animation:none}}
</style><style id="fm-cine-refinement">#fmCinematic{scroll-snap-align:start}#fmCinematic .fm-cine-text{padding-bottom:85px}#fmCinematic .fm-cine-text p:last-of-type{font-weight:600;letter-spacing:.04em}#fmCinematic .fm-cine-arrow{transform:rotate(180deg);font-weight:800}#fmCinematic video:not([src]){opacity:.95}#fmCinematic{background:radial-gradient(ellipse at 50% 30%,#87252f 0%,#2b0e17 42%,#09090b 78%)}#fmCinematic::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,#ffffff0b 50%,transparent 80%);pointer-events:none}#fmCinematic .fm-cine-scroll{display:block;margin:12px auto 0;border:1px solid #e99ca6;background:#151013aa;color:#fff;border-radius:30px;padding:10px 22px;cursor:pointer}#fmCinematic .fm-cine-scroll:focus-visible{outline:3px solid #fff}</style><style id="fm-fullscreen-fix">#fmCinematic{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;min-height:100svh!important;max-height:none!important;z-index:2147483000!important;border:0!important;border-radius:0!important;margin:0!important;transform:translateY(0);transition:transform .65s cubic-bezier(.22,1,.36,1),opacity .5s ease;box-sizing:border-box!important}#fmCinematic.fm-cine-dismissed{transform:translateY(-105%);opacity:0;pointer-events:none}#fmCinematic .fm-cine-text{padding-bottom:max(85px,env(safe-area-inset-bottom) + 65px)!important}body.fm-cine-locked{overflow:hidden!important}#fmCinematic .fm-cine-scroll{min-height:48px;touch-action:manipulation}#fmCinematic video{display:block;object-fit:cover}@media(prefers-reduced-motion:reduce){#fmCinematic{transition:none}}</style></head><body>
<header><strong>FOSTER'S MEDIA</strong><div class="muted">Influencer portal · Private test page</div></header><main>
<section id="signin"><h1>Sign in with email</h1><p class="muted">Use the email registered with Foster's Media. We'll send you a secure sign-in link.</p><label>Your email<input id="email" type="email" autocomplete="email" placeholder="you@example.com"></label><button id="sendLink">Send sign-in link</button><p id="signMsg" class="notice"></p></section>
<section id="account" class="hidden"><div id="fmCinematic" aria-label="Foster's Media cinematic welcome"><video autoplay muted loop playsinline preload="metadata" poster="" aria-hidden="true"><source src="./media/fosters-welcome.mp4" type="video/mp4"></video><div class="fm-cine-text"><h2>FOSTER'S MEDIA</h2><p>Welcome to your workspace</p><p>Swipe up to explore your dashboard</p><button class="fm-cine-scroll" type="button">Swipe up to enter ↑</button></div></div><button id="logout" class="secondary">Sign out</button><h1 id="welcome">Your campaigns</h1><div id="campaigns"></div><p id="accountMsg" class="notice"></p></section>
</main><script>
async function loadSupabaseLibrary(){if(window.supabase?.createClient)return;for(const url of ['https://unpkg.com/@supabase/supabase-js@2.49.10/dist/umd/supabase.js','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.js']){try{await new Promise((resolve,reject)=>{const el=document.createElement('script');el.src=url;el.onload=resolve;el.onerror=reject;document.head.appendChild(el)});if(window.supabase?.createClient)return}catch(e){}}throw Error('Could not load secure login. Check your connection and reload.')}
async function startPortal(){await loadSupabaseLibrary();
const db=window.supabase.createClient('https://naonyxojsozwatpsiogo.supabase.co','sb_publishable_-B_chzmxnDeoQzWnzxcUWQ_vA1b4_L9'),$=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>v==null?'Not set':new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(v);
$('sendLink').onclick=async()=>{const email=$('email').value.trim();if(!email)return $('signMsg').textContent='Enter your registered email.';$('sendLink').disabled=true;const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});$('sendLink').disabled=false;$('signMsg').textContent=error?(error.message.toLowerCase().includes('rate limit')?'Email sending limit reached. Please wait before trying again; do not keep tapping the button.':'Could not send the link: '+error.message):'Check your inbox for the sign-in link. Only registered influencers can view campaigns.'};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
async function start(){const {data:{user},error}=await db.auth.getUser();if(error||!user)return;$('signin').classList.add('hidden');$('account').classList.remove('hidden');$('accountMsg').textContent='Checking your account…';
const {data:linked,error:linkError}=await db.rpc('link_my_influencer_email');if(linkError){$('accountMsg').textContent='Account verification failed. Contact Foster’s Media admin.';return}
if(!linked){$('campaigns').textContent='No Campaigns Assigned';$('accountMsg').textContent='If you were registered with this email, ask your admin to check your account details.';return}
const {data:me,error:meError}=await db.from('influencers').select('id,name').limit(1).maybeSingle();if(meError||!me){$('accountMsg').textContent='Could not load your profile'+(meError?': '+meError.message:'. Your email may not match an active registered profile.');return}
$('welcome').textContent='Welcome, '+me.name;
const {data:assignments,error:aError}=await db.from('assignments').select('id,campaign_id,total_pay').eq('influencer_id',me.id);if(aError){$('accountMsg').textContent='Could not load your campaigns: '+aError.message;return}
if(!assignments?.length){$('campaigns').textContent='No Campaigns Assigned';$('accountMsg').textContent='';return}
const ids=assignments.map(a=>a.campaign_id),[c,v]=await Promise.all([db.from('campaigns').select('id,name,location,maps_url,instructions').in('id',ids),db.from('visits').select('assignment_id,visit_number,completed_at').in('assignment_id',assignments.map(a=>a.id)).order('visit_number')]);
if(c.error||v.error){$('accountMsg').textContent='Could not load campaign details.';return}
const wrap=$('campaigns');wrap.replaceChildren();for(const a of assignments){const campaign=c.data.find(x=>x.id===a.campaign_id);if(!campaign)continue;const card=document.createElement('article'),title=document.createElement('h2');title.textContent=campaign.name;card.append(title);
for(const [label,value] of [['Location',campaign.location||'Not set'],['Agreed total pay',money(a.total_pay)],['Instructions',campaign.instructions||'Not set']]){const p=document.createElement('p');p.textContent=label+': '+value;card.append(p)}
if(campaign.maps_url&&/^https:\/\//i.test(campaign.maps_url)){const link=document.createElement('a');link.href=campaign.maps_url;link.rel='noopener noreferrer';link.target='_blank';link.textContent='View location on map';card.append(link)}
for(let i=1;i<=4;i++){const visit=v.data.find(x=>x.assignment_id===a.id&&x.visit_number===i),p=document.createElement('div');p.className='visit';const heading=document.createElement('p');heading.textContent='Visit '+i+' — '+(visit?.completed_at?'Completed':'Pending');p.append(heading);if(visit){const file=document.createElement('input');file.type='file';file.multiple=true;file.accept='image/jpeg,image/png,image/webp';file.setAttribute('aria-label','Upload screenshots for Visit '+i);const upload=document.createElement('button');upload.textContent='Upload screenshots';const feedback=document.createElement('p');feedback.className='notice';upload.onclick=async()=>{if(!file.files.length)return feedback.textContent='Choose at least one screenshot.';upload.disabled=true;feedback.textContent='Uploading…';let uploaded=0;for(const f of file.files){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>10*1024*1024){feedback.textContent='Only JPG, PNG or WebP images up to 10 MB are allowed.';break}const ext=f.type==='image/jpeg'?'jpg':f.type==='image/png'?'png':'webp',storage_path=visit.id+'/'+crypto.randomUUID()+'.'+ext;const {error:storageError}=await db.storage.from('visit-evidence').upload(storage_path,f,{contentType:f.type,upsert:false});if(storageError){feedback.textContent='Upload failed: '+storageError.message;break}const {error:recordError}=await db.from('visit_screenshots').insert({visit_id:visit.id,storage_path});if(recordError){feedback.textContent='File uploaded, but visit confirmation failed. Contact admin: '+recordError.message;break}uploaded++;feedback.textContent=uploaded+' screenshot(s) saved.'}upload.disabled=false;if(uploaded)heading.textContent='Visit '+i+' — Completed'};p.append(file,upload,feedback)}card.append(p)}wrap.append(card)}
$('accountMsg').textContent='Test mode: upload evidence only for your own assigned visits.'}
db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN')setTimeout(start,0)});start();
}
startPortal().catch(e=>{document.getElementById('signMsg').textContent=e.message||'Unable to start influencer portal.'});
</script><script id="fm-cine-interaction">(function(){document.addEventListener('click',function(e){const b=e.target.closest('.fm-cine-scroll');if(!b)return;const h=b.closest('#fmCinematic');if(h?.nextElementSibling)h.nextElementSibling.scrollIntoView({behavior:'smooth',block:'start'});else window.scrollBy({top:Math.max(window.innerHeight*.85,500),behavior:'smooth'});});})();</script><script id="fm-fullscreen-control">(function(){let touchStart=0;function init(){const hero=document.getElementById('fmCinematic');if(!hero||hero.dataset.fmReady)return;hero.dataset.fmReady='1';document.body.classList.add('fm-cine-locked');function dismiss(){hero.classList.add('fm-cine-dismissed');document.body.classList.remove('fm-cine-locked');window.scrollTo({top:0,behavior:'instant'});const v=hero.querySelector('video');if(v)v.pause()}hero.addEventListener('touchstart',e=>{touchStart=e.touches[0]?.clientY||0},{passive:true});hero.addEventListener('touchend',e=>{if(touchStart-(e.changedTouches[0]?.clientY||0)>65)dismiss()},{passive:true});hero.querySelector('.fm-cine-scroll')?.addEventListener('click',e=>{e.stopPropagation();dismiss()});hero.addEventListener('wheel',e=>{if(e.deltaY>15)dismiss()},{passive:true});hero.querySelector('video')?.play().catch(()=>{});}const obs=new MutationObserver(()=>{const h=document.getElementById('fmCinematic');if(h&&h.getClientRects().length)init()});obs.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});document.addEventListener('DOMContentLoaded',init);setTimeout(init,200)})();</script></body></html>
