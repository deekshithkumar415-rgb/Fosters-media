<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foster's Media | Sign In</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#1e142f,#39204c 55%,#24142e);font-family:system-ui,-apple-system,sans-serif;color:#30223e;display:grid;place-items:center;padding:20px}.card{width:min(100%,440px);background:#fff;border-radius:24px;padding:28px;box-shadow:0 22px 75px #100a1a66}.brand{text-align:center}.brand img{width:110px;height:110px;object-fit:contain;display:none;margin:auto}.brand h1{margin:8px 0 4px;font-size:26px;color:#2e2044}.brand p{color:#776b84;margin:0 0 24px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f3eef8;border-radius:13px;padding:5px;gap:5px;margin-bottom:22px}.tabs button{border:0;background:transparent;color:#675678;padding:12px;border-radius:10px;font-weight:750;font-size:15px}.tabs button[aria-selected=true]{background:#6c3eb0;color:#fff;box-shadow:0 3px 10px #6c3eb033}label{display:block;font-weight:650;margin:14px 0 0}input{width:100%;font-size:16px;padding:14px;border:1px solid #d8cce5;border-radius:11px;margin-top:7px;background:#fff;color:#30223e}.submit{width:100%;margin-top:20px;background:#6c3eb0;border:0;border-radius:12px;padding:15px;color:white;font-size:16px;font-weight:750}.submit:disabled{opacity:.6}.help{font-size:13px;color:#766a83;line-height:1.5}.msg{min-height:22px;font-size:14px;color:#703c9e;margin-top:14px;overflow-wrap:anywhere}.hidden{display:none}.footer{text-align:center;color:#b6a6c5;font-size:12px;margin-top:20px}@media(min-width:1000px){body{background:radial-gradient(circle at 18% 30%,#563b78 0,transparent 36%),linear-gradient(130deg,#20132e,#352044);padding:42px}.card{width:520px;padding:42px 48px;border-radius:28px}.brand img{width:130px;height:130px}.brand h1{font-size:32px}.brand p{font-size:16px}.tabs button{font-size:16px;padding:15px}input{padding:16px}.footer{font-size:14px}}@media(max-width:480px){.card{padding:22px;border-radius:19px}.brand h1{font-size:24px}} </style><style id="fosters-red-black-theme">
:root{color-scheme:dark;--fm-red:#ed343e;--fm-red-light:#ff5962;--fm-black:#0c0c0e;--fm-panel:#19191c;--fm-border:#363033}
body{background:radial-gradient(ellipse at 10% 10%,#54151d 0%,transparent 35%),linear-gradient(135deg,#080809 0%,#19191c 60%,#0b0b0d 100%)!important;color:#f8f4f4!important}
.card{background:#171719!important;border:1px solid #463034!important;box-shadow:0 24px 85px #0009,0 0 40px #dc293011!important;color:#f6f2f2!important}
.brand h1{color:#fff!important}.brand p,.help{color:#c1b7b9!important}
.tabs{background:#282326!important}.tabs button{color:#e3d7d9!important}.tabs button[aria-selected=true]{background:#e3333f!important;color:white!important;box-shadow:0 3px 14px #e3333f44!important}
label{color:#f1e9ea!important}input{background:#101012!important;color:#fff!important;border:1px solid #594247!important}input:focus{outline:2px solid #ff4c57;outline-offset:1px}
.submit{background:#e3333f!important;color:#fff!important}.submit:hover{background:#fa4651!important}.msg{color:#ff7e86!important}.footer{color:#c3b2b4!important}
@media(min-width:1000px){body{background:radial-gradient(ellipse at 15% 20%,#56151b 0,transparent 32%),linear-gradient(125deg,#070708,#1a1719 60%,#09090b)!important}}
</style></head><body><main><div class="card"><div class="brand"><img id="brandLogo" alt="Foster's Media logo"><h1>Foster's Media</h1><p>Welcome to your workspace</p></div><div class="tabs" role="tablist" aria-label="Choose sign in"><button type="button" id="adminTab" role="tab" aria-selected="true">Admin Login</button><button type="button" id="influencerTab" role="tab" aria-selected="false">Influencer Login</button></div><form id="loginForm"><label>Email address<input id="email" type="email" autocomplete="email" placeholder="name@example.com" required></label><div id="passwordWrap"><label>Password<input id="password" type="password" autocomplete="current-password" required></label></div><button class="submit" id="submit" type="submit">Sign in as Admin</button></form><p class="help" id="help">Only authorized Foster's Media administrators can access the admin dashboard.</p><div id="message" class="msg" role="status" aria-live="polite"></div></div><div class="footer">Secure access · Foster's Media</div></main><script>
const $=id=>document.getElementById(id);let role='admin',db=null;
const adminPage='./admin-cinematic-v22.html',influencerPage='./influencer-cinematic-v9.html';
function setRole(next){role=next;$('adminTab').setAttribute('aria-selected',String(next==='admin'));$('influencerTab').setAttribute('aria-selected',String(next==='influencer'));$('passwordWrap').classList.toggle('hidden',next!=='admin');$('password').required=next==='admin';$('submit').textContent=next==='admin'?'Sign in as Admin':'Email me a sign-in link';$('help').textContent=next==='admin'?"Only authorized Foster's Media administrators can access the admin dashboard.":"Use the email registered with Foster's Media. We'll send a secure login link."; $('message').textContent=''}
$('adminTab').onclick=()=>setRole('admin');$('influencerTab').onclick=()=>setRole('influencer');
(async()=>{try{const r=await fetch('./fosters-logo.b64.txt');if(r.ok){const raw=(await r.text()).trim();if(/^[A-Za-z0-9+/=]+$/.test(raw)){$('brandLogo').src='data:image/webp;base64,'+raw;$('brandLogo').style.display='block'}}}catch(e){}})();
async function loadSupabase(){if(window.supabase?.createClient)return;for(const url of ['https://unpkg.com/@supabase/supabase-js@2.49.10/dist/umd/supabase.js','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.js']){try{await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});if(window.supabase?.createClient)return}catch(e){}}throw Error('Could not load secure sign-in. Check your internet connection and reload.')}
async function client(){if(!db){await loadSupabase();db=window.supabase.createClient('https://naonyxojsozwatpsiogo.supabase.co','sb_publishable_-B_chzmxnDeoQzWnzxcUWQ_vA1b4_L9')}return db}
async function routeSession(){const c=await client();const {data:{user},error}=await c.auth.getUser();if(error||!user)return false;const {data:admins,error:adminError}=await c.from('admins').select('user_id').eq('user_id',user.id).limit(1);if(!adminError&&admins?.length){location.replace(adminPage);return true}await c.rpc('link_my_influencer_email');const {data:influencers,error:infError}=await c.from('influencers').select('id').eq('auth_user_id',user.id).limit(1);if(!infError&&influencers?.length){location.replace(influencerPage);return true}return false}
$('loginForm').onsubmit=async e=>{e.preventDefault();const btn=$('submit'),msg=$('message');btn.disabled=true;msg.textContent='Please wait…';try{const c=await client();const email=$('email').value.trim();if(role==='admin'){const {error}=await c.auth.signInWithPassword({email,password:$('password').value});if(error)throw error;msg.textContent='Signed in. Opening your dashboard…';if(!await routeSession())msg.textContent='This account is not registered as an admin or influencer.'}else{const redirectTo=new URL('./login.html',location.href).href;const {error}=await c.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo,shouldCreateUser:true}});if(error)throw error;msg.textContent='Check your email for your secure sign-in link. Open it on this device.'}}catch(error){msg.textContent=error.message||'Sign-in failed. Please try again.'}finally{btn.disabled=false}};
(async()=>{try{const c=await client();const {data:{session}}=await c.auth.getSession();if(session){$('message').textContent='Checking your account…';if(!await routeSession())$('message').textContent='Please choose the correct login.'}}catch(e){$('message').textContent=e.message}})();
</script></body></html>
